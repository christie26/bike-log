<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Etienne's bike adventure</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; }
    #bar { position: absolute; top: 10px; right: 10px; z-index: 1000; background: #fff; padding: 6px; border-radius: 4px; font: 14px sans-serif; }
  </style>
</head>
<body>
  <div id="bar"></div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { Decoder, Stream } from 'https://cdn.jsdelivr.net/npm/@garmin/fitsdk@21.217.0/+esm';

    const map = L.map('map', { preferCanvas: true }).setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
    }).addTo(map);
    const layer = L.layerGroup().addTo(map);

    // Decode a .fit file into [{date, lat, lng, speed}]. FIT stores positions in semicircles and speed in m/s.
    function parseFit(buffer) {
      const { messages, errors } = new Decoder(Stream.fromArrayBuffer(buffer)).read();
      if (errors.length) console.warn(errors);
      const toDeg = (semi) => semi * 180 / 2 ** 31;
      return (messages.recordMesgs || [])
        .filter((r) => r.positionLat != null && r.positionLong != null)
        .map((r) => ({
          date: r.timestamp.toISOString(),
          lat: toDeg(r.positionLat),
          lng: toDeg(r.positionLong),
          speed: +((r.enhancedSpeed ?? r.speed ?? NaN) * 3.6).toFixed(1), // km/h
        }));
    }

    function popup(p, label) {
      return `<b>${label}</b> (${p.file})<br>${p.date}<br>lat ${p.lat}, lng ${p.lng}<br>speed ${p.speed} km/h`;
    }

    async function loadAll() {
      const files = await (await fetch('coordinate/files.json')).json();
      const buffers = await Promise.all(files.map(async (f) =>
        (await fetch('coordinate/' + encodeURIComponent(f))).arrayBuffer()));
      // Merge every file into one array, sorted by time.
      const points = buffers.flatMap((b, i) => parseFit(b).map((p) => ({ ...p, file: files[i] })))
        .sort((a, b) => new Date(a.date) - new Date(b.date));
      console.log(points);
      document.getElementById('bar').textContent = `${files.length} files, ${points.length} points`;
      if (!points.length) return;

      const line = L.polyline(points.map((p) => [p.lat, p.lng]), { color: 'blue', weight: 4 }).addTo(layer);
      map.fitBounds(line.getBounds(), { padding: [30, 30] });

      for (let i = 1; i < points.length - 1; i++) {
        L.circleMarker([points[i].lat, points[i].lng], { radius: 3, color: 'orange' })
          .bindPopup(popup(points[i], `Point ${i}`)).addTo(layer);
      }
      const first = points[0], last = points[points.length - 1];
      L.marker([first.lat, first.lng]).bindPopup(popup(first, 'Start')).addTo(layer);
      L.marker([last.lat, last.lng]).bindPopup(popup(last, 'End')).addTo(layer);
    }

    loadAll();
  </script>
</body>
</html>
