<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <script>
    // The GitHub Pages address was shared before the guestbook; send its visitors to the Railway server, which has the API.
    const RAILWAY_URL = 'https://bike-log-production.up.railway.app'; // e.g. 'https://bike-log.up.railway.app'; empty: no redirect
    if (RAILWAY_URL && location.hostname.endsWith('github.io')) location.replace(RAILWAY_URL + '/' + location.search + location.hash);
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Etienne's bike adventure</title>
  <link rel="icon" type="image/jpeg" href="bike.jpeg" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; }
    #map { flex: 1; }
    /* Elevation chart under the map; hovering it marks the matching point on the route */
    #elev { position: relative; height: 140px; flex: none; background: #fff; box-shadow: 0 -1px 4px rgba(0, 0, 0, .2);
      font: 12px sans-serif; touch-action: none; z-index: 1000; }
    #elev svg { display: block; width: 100%; height: 100%; }
    #elev-tip { position: absolute; top: 4px; display: none; pointer-events: none; white-space: nowrap; color: #222;
      background: #fff; padding: 3px 8px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
    #rides { position: absolute; top: 80px; left: 10px; z-index: 1000; background: #fff; padding: 8px 12px; border-radius: 12px;
      font: 14px sans-serif; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); max-height: 70vh; overflow-y: auto; }
    #rides table { border-collapse: collapse; }
    #rides td { padding: 2px 6px; }
    #lang { font: inherit; border: 1px solid #ccc; border-radius: 8px; padding: 2px 6px; background: #fff; }
    #rides td:last-child { text-align: right; }
    #rides tfoot td { border-top: 1px solid #ccc; font-weight: bold; }
    /* Day rows and the total row are clickable: a day shows only its rides, the total shows them all */
    #rides tbody tr, #rides tfoot tr { cursor: pointer; }
    #rides tbody tr:hover, #rides tfoot tr:hover { background: #f0f4f5; }
    #rides tr.selected { background: var(--label-bg); }
    #rides .day-n { color: #777; }
    #upload { position: absolute; top: 10px; right: 10px; z-index: 1000; background: #fff; padding: 4px 8px; border-radius: 4px;
      font: 12px sans-serif; color: #555; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
    #lang-box { position: absolute; bottom: 170px; left: 10px; z-index: 1000; background: #fff; padding: 6px 10px; border-radius: 12px;
      font: 14px sans-serif; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
    /* Language box and guestbook button share one height, so they line up at the same level */
    #lang-box, #gb-open { box-sizing: border-box; height: 34px; display: flex; align-items: center; gap: 6px; }
    #gb-open[hidden] { display: none; }
    /* Start and end labels: rounded box without the pointer; colors from LABEL_BG_COLOR and LABEL_TEXT_COLOR */
    .ride-label { font-weight: bold; color: var(--label-text); background: var(--label-bg); border-color: var(--label-bg); border-radius: 6px; }
    .ride-label::before { display: none; }
    .label-start { color: var(--start); }
    .label-end { color: var(--end); }
    /* Legend: what the map marks mean */
    #legend { position: absolute; top: 44px; right: 10px; z-index: 1000; background: #fff; padding: 6px 10px; border-radius: 12px;
      font: 12px sans-serif; color: #333; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); line-height: 1.7; }
    .swatch { display: inline-block; width: 8px; height: 8px; border: 2.5px solid; border-radius: 50%; background: #fff;
      vertical-align: -2px; margin-right: 6px; }
    .milestone-label { color: var(--milestone); }
    .milestone-done { color: var(--milestone-done); font-weight: normal; }
    #milestone-next { margin-top: 6px; }
    /* Ring that grows and fades around the milestone Etienne is heading to */
    .milestone-pulse { width: 100%; height: 100%; border-radius: 50%; background: var(--milestone);
      animation: milestone-pulse 1.6s ease-out infinite; }
    @keyframes milestone-pulse { from { transform: scale(1); opacity: .7; } to { transform: scale(3.5); opacity: 0; } }
    /* Guestbook: button above the elevation chart opens the message panel */
    #gb-open { position: absolute; bottom: 170px; right: 10px; z-index: 1000; font: 14px sans-serif; background: #fff; border: 0;
      padding: 6px 10px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); cursor: pointer; }
    /* While the panel is closed, a ring pulses and the button wiggles now and then to draw visitors in */
    #gb-open.gb-closed { animation: gb-ring 1.8s ease-out infinite, gb-wiggle 4s ease-in-out infinite; }
    @keyframes gb-ring {
      from { box-shadow: 0 1px 4px rgba(0, 0, 0, .3), 0 0 0 0 var(--milestone); }
      to { box-shadow: 0 1px 4px rgba(0, 0, 0, .3), 0 0 0 10px transparent; } }
    @keyframes gb-wiggle { 0%, 85%, 100% { transform: rotate(0); } 88% { transform: rotate(-6deg); } 91% { transform: rotate(6deg); }
      94% { transform: rotate(-4deg); } 97% { transform: rotate(3deg); } }
    @media (prefers-reduced-motion: reduce) { #gb-open.gb-closed { animation: none; } }
    #gb { position: absolute; bottom: 210px; right: 10px; z-index: 1000; width: min(320px, calc(100vw - 20px)); max-height: 60vh;
      display: flex; flex-direction: column; gap: 8px; background: #fff; padding: 10px; border-radius: 12px;
      font: 14px sans-serif; color: #222; box-shadow: 0 4px 16px rgba(0, 0, 0, .25); }
    #gb[hidden] { display: none; }
    /* Messages: one rounded bubble each, name in bold and time beside it */
    #gb-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; color: #777; }
    .gb-msg { background: var(--label-bg); padding: 6px 10px; border-radius: 10px; color: #222; line-height: 1.35;
      white-space: pre-wrap; overflow-wrap: anywhere; }
    .gb-meta { font-size: 12px; color: #777; margin-bottom: 2px; }
    .gb-name { font-weight: bold; color: var(--label-text); margin-right: 6px; }
    #gb-form { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1px solid #eee; }
    #gb-form input, #gb-form textarea, #gb-form button { font: inherit; }
    #gb-form input, #gb-form textarea { border: 1px solid #ccc; border-radius: 8px; padding: 6px 8px; }
    #gb-form input:focus, #gb-form textarea:focus { outline: none; border-color: var(--end); }
    #gb-form textarea { resize: vertical; min-height: 3em; }
    #gb-send { align-self: flex-end; border: 0; border-radius: 8px; padding: 6px 16px; background: var(--end); color: #fff;
      font-weight: bold; cursor: pointer; }
    #gb-send:disabled { opacity: .5; cursor: default; }
    /* Phones: lower elevation chart (boxes above it follow) and denser guestbook messages */
    @media (max-width: 600px) {
      #elev { height: 100px; }
      #lang-box, #gb-open { bottom: 130px; }
      #gb { bottom: 170px; gap: 6px; padding: 8px; }
      #gb-list { gap: 4px; }
      .gb-msg { padding: 4px 8px; font-size: 13px; line-height: 1.3; }
      .gb-meta { font-size: 11px; margin-bottom: 0; }
      /* Pinch zooms on phones, so the +/- buttons go and the rides box takes their place */
      .leaflet-control-zoom { display: none; }
      #rides { top: 10px; font-size: 12px; padding: 4px 8px; }
      #rides td { padding: 1px 4px; }
    }
    .route-hover { pointer-events: none; } /* so the route hover popup does not block the line under the cursor */
    .leaflet-tile-pane { filter: saturate(0.4) brightness(1.05); } /* muted base map only; route and markers keep their colors */
  </style>
</head>
<body>
  <div id="rides">
    <div id="ride-list"></div>
    <div id="milestone-next" hidden></div>
  </div>
  <label id="lang-box"><span id="lang-text">Language</span>
    <select id="lang">
      <option value="ko">🇰🇷 한국어</option>
      <option value="es">🇲🇽 Español</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="en">🇬🇧 English</option>
      <option value="ja">🇯🇵 日本語</option>
    </select>
  </label>
  <div id="map"></div>
  <div id="upload" hidden></div>
  <div id="legend"></div>
  <button id="gb-open" hidden></button>
  <div id="gb" hidden>
    <div id="gb-list"></div>
    <form id="gb-form">
      <input id="gb-name" maxlength="40" required />
      <textarea id="gb-text" maxlength="500" required></textarea>
      <button id="gb-send"></button>
    </form>
  </div>
  <div id="elev"><svg></svg><div id="elev-tip"></div></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { Decoder, Stream } from 'https://cdn.jsdelivr.net/npm/@garmin/fitsdk@21.217.0/+esm';
    import { LOCALES, TEXT } from './text.js';

    const map = L.map('map', { preferCanvas: true }).setView([0, 0], 2);
    // Colors muted by the .leaflet-tile-pane CSS rule. Other themes: https://leaflet-extras.github.io/leaflet-providers/preview/
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
    }).addTo(map);
    const layer = L.layerGroup().addTo(map);

    const FIT_EPOCH_S = 631065600; // FIT times count from 1989-12-31T00:00:00Z
    const ROUTE_HIT_PX = 16; // width of the invisible hover area along the route line
    const RIDE_GAP_MS = 4 * 3600 * 1000; // a pause longer than this starts a new ride (e.g. overnight)
    const LINE_COLOR = '#5a9baa'; // route line
    const START_COLOR = '#2e8b57'; // start circle, its label text and the start flag
    const END_COLOR = '#2a5674'; // end circle and its label text
    const HOVER_COLOR = '#2a5674'; // marker under the pointer, on the map and the chart
    const OVERNIGHT_M = 500; // a day's end and the next day's start closer than this share one label
    const END_RADIUS = 6; // start and end circles; route dots have radius 3
    const STOP_RADIUS = 3; // small dot where a ride starts or ends in the middle of a day
    const LABEL_BG_COLOR = '#e9f2f3'; // background of the start and end labels; last 2 digits = opacity (b3 = 70%)
    const LABEL_TEXT_COLOR = '#2a5674'; // text of the labels, unless colored by start or end
    const ELEV_FILL_OPACITY = 0.2; // area under the elevation line, in LINE_COLOR
    const ETIENNE_SIZE = 64; // photo at the end of the path, in px
    const MILESTONE_COLOR = '#d9822b'; // milestones not reached yet; the next one is filled
    const MILESTONE_DONE_COLOR = '#9aa5a8'; // milestones already reached
    const FLAG_SIZE = 28; // flags on the trip's first point and the last milestone, in px
    document.documentElement.style.setProperty('--label-bg', LABEL_BG_COLOR);
    document.documentElement.style.setProperty('--label-text', LABEL_TEXT_COLOR);
    document.documentElement.style.setProperty('--start', START_COLOR);
    document.documentElement.style.setProperty('--end', END_COLOR);
    document.documentElement.style.setProperty('--milestone', MILESTONE_COLOR);
    document.documentElement.style.setProperty('--milestone-done', MILESTONE_DONE_COLOR);

    // Decode a .fit file into rides: [{file, points [{date, lat, lng, speed, alt}], km, offsetMs}].
    // A multi-day file is split into one ride per pause longer than RIDE_GAP_MS.
    // FIT stores positions in semicircles, speed in m/s and altitude in m.
    function parseFit(buffer, file) {
      const { messages, errors } = new Decoder(Stream.fromArrayBuffer(buffer)).read();
      if (errors.length) console.warn(file, errors);
      const toDeg = (semi) => semi * 180 / 2 ** 31;

      // Local time offset recorded by the device; fall back to the viewer's timezone.
      const act = (messages.activityMesgs || [])[0];
      const offsetMs = act && act.localTimestamp != null && act.timestamp
        ? (act.localTimestamp + FIT_EPOCH_S) * 1000 - act.timestamp.getTime()
        : null;

      const points = (messages.recordMesgs || [])
        .filter((r) => r.positionLat != null && r.positionLong != null)
        .map((r) => ({
          file,
          offsetMs,
          date: r.timestamp.toISOString(),
          lat: toDeg(r.positionLat),
          lng: toDeg(r.positionLong),
          speed: +((r.enhancedSpeed ?? r.speed ?? NaN) * 3.6).toFixed(1), // km/h
          alt: r.enhancedAltitude ?? r.altitude ?? null, // m
        }))
        .sort((a, b) => new Date(a.date) - new Date(b.date));

      const segments = [];
      points.forEach((p, i) => {
        if (!i || new Date(p.date) - new Date(points[i - 1].date) > RIDE_GAP_MS) segments.push([]);
        segments[segments.length - 1].push(p);
      });
      // Use the device's recorded distance for a single ride; otherwise sum the GPS track of each ride.
      const sessionM = (messages.sessionMesgs || []).reduce((sum, s) => sum + (s.totalDistance || 0), 0);
      return segments.map((seg) => {
        let trackM = 0;
        for (let i = 1; i < seg.length; i++) trackM += L.latLng(seg[i - 1]).distanceTo(seg[i]);
        const km = ((segments.length === 1 && sessionM) || trackM) / 1000;
        return { file, points: seg, km, offsetMs };
      });
    }

    // Date parts in the ride's local time.
    function localParts(iso, offsetMs) {
      const t = new Date(iso);
      const pad = (n) => String(n).padStart(2, '0');
      if (offsetMs == null) return { yyyy: t.getFullYear(), dd: pad(t.getDate()), mm: pad(t.getMonth() + 1), HH: pad(t.getHours()), MM: pad(t.getMinutes()) };
      const d = new Date(t.getTime() + offsetMs);
      return { yyyy: d.getUTCFullYear(), dd: pad(d.getUTCDate()), mm: pad(d.getUTCMonth() + 1), HH: pad(d.getUTCHours()), MM: pad(d.getUTCMinutes()) };
    }

    // "2026-09-27", the value format of <input type="date">
    function isoDay(iso, offsetMs) {
      const t = localParts(iso, offsetMs);
      return `${t.yyyy}-${t.mm}-${t.dd}`;
    }

    // Date in the ride's local time, in the format of the chosen language.
    function formatDate(iso, offsetMs, opts) {
      const local = offsetMs == null; // no recorded offset: the viewer's timezone
      const d = new Date(new Date(iso).getTime() + (local ? 0 : offsetMs));
      return new Intl.DateTimeFormat(LOCALES[langSelect.value], local ? opts : { ...opts, timeZone: 'UTC' }).format(d);
    }

    // "4 Oct", "10월 4일"
    function dayMonth(iso, offsetMs) {
      return formatDate(iso, offsetMs, { day: 'numeric', month: 'short' });
    }

    // "4 Oct, 14:05", "10월 4일 14:05"
    function dayTime(iso, offsetMs) {
      return formatDate(iso, offsetMs, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
    }

    const langSelect = document.getElementById('lang');
    const t = (key) => TEXT[langSelect.value][key];
    try { langSelect.value = localStorage.getItem('lang') || 'en'; } catch {}
    if (!langSelect.value) langSelect.value = 'en'; // stored value no longer offered

    // Text that does not depend on the rides.
    function applyLanguage() {
      document.documentElement.lang = langSelect.value;
      document.getElementById('lang-text').textContent = t('lang');
      document.getElementById('gb-open').textContent = `💬 ${t('guestbook')}`;
      document.getElementById('gb-name').placeholder = t('yourName');
      document.getElementById('gb-text').placeholder = t('yourMessage');
      document.getElementById('gb-send').textContent = t('send');
    }
    applyLanguage();

    langSelect.onchange = () => {
      try { localStorage.setItem('lang', langSelect.value); } catch {}
      map.closePopup();
      applyLanguage();
      drawMilestoneNext();
      drawLastUpload();
      drawLegend();
      drawMessages();
      showRides(shownRides, false); // labels, rides box and chart in the new language
      queueCities(allRides.map(cityJob)); // city lists in the new language
    };
    const nominatimLang = () => langSelect.value;

    // {city, region} from OpenStreetMap Nominatim, cached per ~1 km cell (2 decimals) and language; null on failure.
    // Requests are spaced NOMINATIM_GAP_MS apart (Nominatim limit: 1 request per second).
    const NOMINATIM_GAP_MS = 1100;
    const placeCache = new Map();
    let nextFetchAt = 0;
    function address(p) {
      const lang = nominatimLang();
      const key = `${lang},${p.lat.toFixed(2)},${p.lng.toFixed(2)}`;
      if (!placeCache.has(key)) {
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&accept-language=${lang}&lat=${p.lat}&lon=${p.lng}`;
        const wait = Math.max(0, nextFetchAt - Date.now());
        nextFetchAt = Date.now() + wait + NOMINATIM_GAP_MS;
        placeCache.set(key, new Promise((ok) => setTimeout(ok, wait)).then(() => fetch(url)).then((r) => r.json()).then((j) => {
          // City, then its département (France) or province/region; the region is skipped when it repeats the city.
          const a = j.address || {};
          const city = a.city || a.town || a.village || a.municipality || j.name;
          const region = [a.state_district, a.county, a.province, a.state].find((r) => r && r !== city);
          return { city, region };
        }).catch(() => { placeCache.delete(key); return null; }));
      }
      return placeCache.get(key);
    }

    // "City, region" for a popup. Fetched only when a popup opens.
    function placeName(p) {
      return address(p).then((a) => !a ? t('noAddress') : [a.city, a.region].filter(Boolean).join(', ') || t('unknownPlace'));
    }

    function popup(p, label, place = '…') {
      return `<b>${label}</b> ${dayTime(p.date, p.offsetMs)}<br>${place}`
        + `<br>(${p.lat.toFixed(3)}, ${p.lng.toFixed(3)})<br>${t('speed')} ${p.speed} km/h`
        + (p.alt != null ? `<br>${t('elevation')} ${Math.round(p.alt)} m` : '');
    }

    // Bind a popup that opens on hover (tap on touch screens) and fills in the city name once it has loaded.
    // The name is fetched only if the popup stays open briefly, so sweeping the mouse over the route
    // does not flood Nominatim (limit: 1 request per second).
    function bindPlacePopup(marker, p, label) {
      return marker.bindPopup(popup(p, label), { autoPan: false })
        .on('mouseover', () => marker.openPopup())
        .on('mouseout', () => marker.closePopup())
        .on('popupopen', (e) => {
          e.popup.setContent(popup(p, label)); // drop a name left over from another language
          setTimeout(() => {
            if (!e.popup.isOpen()) return;
            placeName(p).then((place) => e.popup.setContent(popup(p, label, place)));
          }, 300);
        });
    }

    // Start and end circles sit in their own SVG pane above the route dots, which are redrawn on every zoom.
    map.createPane('ends').style.zIndex = 450;
    const endsRenderer = L.svg({ pane: 'ends' });

    // tooltip: HTML of the permanent label; null for no label. text: title of the hover popup.
    function labelMarker(p, text, color, tooltip, labelGap = END_RADIUS) {
      const marker = L.circleMarker([p.lat, p.lng], {
        renderer: endsRenderer, radius: END_RADIUS, color, weight: 3, fillColor: '#ffffff', fillOpacity: 1,
      });
      if (tooltip) marker.bindTooltip(tooltip, { permanent: true, direction: 'top', offset: [0, -labelGap], className: 'ride-label' });
      return bindPlacePopup(marker, p, text);
    }

    // Small unlabeled dot for a ride's start or end inside a day.
    function stopMarker(p, text, color) {
      const marker = L.circleMarker([p.lat, p.lng], {
        renderer: endsRenderer, radius: STOP_RADIUS, color, weight: 2, fillColor: '#ffffff', fillOpacity: 1,
      });
      return bindPlacePopup(marker, p, text);
    }

    // Ride summary, shown when a start or end marker is clicked.
    const SUMMARY_MAX_SAMPLES = 12; // most points looked up along one ride, to keep Nominatim requests low
    const SUMMARY_MIN_STEP_M = 5000;
    const summaryPopup = L.popup({ offset: [0, 7 - END_RADIUS], maxWidth: 320, autoPanPaddingTopLeft: [200, 20] }); // clear the rides box

    // First and last point, plus points spaced evenly along the ride, to find the cities it passes.
    function samplePoints(ride) {
      const pts = ride.points;
      const step = Math.max(SUMMARY_MIN_STEP_M, ride.km * 1000 / SUMMARY_MAX_SAMPLES);
      const out = [pts[0]];
      let sinceLast = 0;
      for (let i = 1; i < pts.length; i++) {
        sinceLast += L.latLng(pts[i - 1]).distanceTo(pts[i]);
        if (sinceLast >= step) { out.push(pts[i]); sinceLast = 0; }
      }
      if (out[out.length - 1] !== pts[pts.length - 1]) out.push(pts[pts.length - 1]);
      return out;
    }

    function summaryHtml(ride, cities, loading) {
      const first = ride.points[0], last = ride.points[ride.points.length - 1];
      const min = Math.round((new Date(last.date) - new Date(first.date)) / 60000);
      const route = cities.join(' → ') + (loading ? ' → …' : '');
      return `<b>${t('ride')(dayMonth(first.date, ride.offsetMs))}</b><br>${route.replace(/^ → /, '')}`
        + `<br>${ride.km.toFixed(1)} km, ${Math.floor(min / 60)}h ${String(min % 60).padStart(2, '0')}m`
        + `<br>${dayTime(first.date, ride.offsetMs)} → ${dayTime(last.date, ride.offsetMs)}`;
    }

    // Cities of each ride, looked up in the background after the page loads and kept in localStorage,
    // so the summary opens without waiting for Nominatim. One job per ride and language.
    const CITIES_STORE = 'rideCities-v1'; // bump when the sampling changes, to drop stale lists
    let storedCities = {};
    try { storedCities = JSON.parse(localStorage.getItem(CITIES_STORE)) || {}; } catch {}
    const cityJobs = new Map();
    const cityQueue = [];
    let cityWorkerBusy = false;

    function cityJob(ride) {
      const lang = nominatimLang();
      const key = `${lang}|${ride.file}|${ride.points[0].date}`;
      if (!cityJobs.has(key)) {
        const stored = storedCities[key];
        cityJobs.set(key, stored
          ? { key, lang, ride, cities: stored, done: true }
          : { key, lang, ride, cities: [], done: false, samples: samplePoints(ride), next: 0 });
      }
      return cityJobs.get(key);
    }

    // Queue the jobs (first = looked up first) and start the worker. Requests go one at a time,
    // so a job moved to the front is served next.
    function queueCities(jobs, first = false) {
      jobs = jobs.filter((j) => !j.done);
      cityQueue.splice(0, cityQueue.length, ...(first ? [...jobs, ...cityQueue] : [...cityQueue, ...jobs])
        .filter((j, i, all) => all.indexOf(j) === i));
      runCityWorker();
    }

    async function runCityWorker() {
      if (cityWorkerBusy) return;
      cityWorkerBusy = true;
      while (cityQueue.length) {
        const job = cityQueue[0];
        if (job.done || job.lang !== nominatimLang()) { cityQueue.shift(); continue; }
        const a = await address(job.samples[job.next]);
        const city = a && (a.city || a.region);
        if (city && city !== job.cities[job.cities.length - 1]) job.cities.push(city);
        if (++job.next === job.samples.length) {
          job.done = true;
          storedCities[job.key] = job.cities;
          try { localStorage.setItem(CITIES_STORE, JSON.stringify(storedCities)); } catch {}
        }
        if (summaryJob === job && summaryPopup.isOpen()) summaryPopup.setContent(summaryHtml(job.ride, job.cities, !job.done));
      }
      cityWorkerBusy = false;
    }

    // Open the summary with the cities found so far; the worker fills in the rest.
    let summaryJob = null;
    function showSummary(ride, latlng) {
      summaryJob = cityJob(ride);
      summaryPopup.setLatLng(latlng).setContent(summaryHtml(ride, summaryJob.cities, !summaryJob.done)).openOn(map);
      queueCities([summaryJob], true);
    }

    // Always lists every day of the trip; the picked day is highlighted.
    function drawRidesBox() {
      const list = document.getElementById('ride-list');
      if (!allRides.length) { list.textContent = t('noRide'); return; }
      // One row per day: rides are in time order, so rides of the same day are adjacent.
      const days = [];
      allRides.forEach((r, i) => {
        if (!i || rideDay(allRides[i - 1]) !== rideDay(r)) {
          days.push({ day: rideDay(r), n: tripDay(r), label: dayMonth(r.points[0].date, r.offsetMs), km: 0 });
        }
        days[days.length - 1].km += r.km;
      });
      const rows = days.map((d) => `<tr data-day="${d.day}"${d.day === pickedDay ? ' class="selected"' : ''}>`
        + `<td><span class="day-n">${t('dayN')(d.n)}</span> · ${d.label}</td><td>${d.km.toFixed(1)} km</td></tr>`).join('');
      const total = allRides.reduce((sum, r) => sum + r.km, 0);
      list.innerHTML = `<table><tbody>${rows}</tbody>`
        + `<tfoot><tr><td>${t('total')}</td><td>${total.toFixed(1)} km</td></tr></tfoot></table>`;
      list.querySelectorAll('tbody tr').forEach((tr) => tr.onclick = () => pickDay(tr.dataset.day === pickedDay ? '' : tr.dataset.day));
      list.querySelector('tfoot tr').onclick = () => pickDay('');
    }

    // Elevation chart: all rides end to end along the distance axis, one area per ride.
    const ELEV_PAD = { top: 22, right: 16, bottom: 20, left: 48 };
    const elevBox = document.getElementById('elev');
    const elevSvg = elevBox.querySelector('svg');
    const elevTip = document.getElementById('elev-tip');
    const hoverMarker = L.circleMarker([0, 0], {
      renderer: endsRenderer, radius: END_RADIUS, color: HOVER_COLOR, weight: 3, fillColor: '#ffffff', fillOpacity: 1, interactive: false,
    });
    let elev = null; // {points [{p, km}], starts [{km, ride}], totalKm, x, y}

    // Distance from the first ride's start to every point, stored as p.km; the chart uses points with an altitude.
    function buildProfile(rides) {
      let km = 0;
      const points = [], starts = [];
      rides.forEach((r) => {
        starts.push({ km, ride: r });
        r.points.forEach((p, i) => {
          if (i) km += L.latLng(r.points[i - 1]).distanceTo(p) / 1000;
          p.km = km;
          if (p.alt != null) points.push({ p, km, ride: r });
        });
      });
      return { points, starts, totalKm: km };
    }

    // Round axis step: 1, 2 or 5 times a power of ten, at least `raw`.
    function niceStep(raw) {
      const pow = 10 ** Math.floor(Math.log10(raw || 1));
      return [1, 2, 5, 10].map((m) => m * pow).find((s) => s >= raw);
    }

    function drawElevation() {
      if (!elev) return;
      const { points, starts, totalKm } = elev;
      const w = elevBox.clientWidth, h = elevBox.clientHeight;
      const alts = points.map((e) => e.p.alt);
      const yStep = niceStep((Math.max(...alts) - Math.min(...alts)) / 3);
      const lo = Math.floor(Math.min(...alts) / yStep) * yStep;
      const hi = Math.max(Math.ceil(Math.max(...alts) / yStep) * yStep, lo + yStep);
      const x = elev.x = (km) => ELEV_PAD.left + km / (totalKm || 1) * (w - ELEV_PAD.left - ELEV_PAD.right);
      const y = elev.y = (alt) => h - ELEV_PAD.bottom - (alt - lo) / (hi - lo) * (h - ELEV_PAD.top - ELEV_PAD.bottom);

      let svg = '';
      for (let a = lo; a <= hi; a += yStep) {
        svg += `<line x1="${ELEV_PAD.left}" x2="${w - ELEV_PAD.right}" y1="${y(a)}" y2="${y(a)}" stroke="#e5e5e5" />`
          + `<text x="${ELEV_PAD.left - 6}" y="${y(a) + 4}" text-anchor="end" fill="#666">${a} m</text>`;
      }
      const xStep = niceStep(totalKm / Math.max(1, Math.floor((w - ELEV_PAD.left - ELEV_PAD.right) / 80)));
      for (let km = 0; km <= totalKm; km += xStep) {
        svg += `<text x="${x(km)}" y="${h - 5}" text-anchor="middle" fill="#666">${+km.toFixed(2)} km</text>`;
      }
      // One area and line per ride, so a gap between days is not bridged.
      starts.forEach((s) => {
        const pts = points.filter((e) => e.ride === s.ride);
        if (!pts.length) return;
        const line = pts.map((e, i) => `${i ? 'L' : 'M'}${x(e.km).toFixed(1)},${y(e.p.alt).toFixed(1)}`).join('');
        const base = y(lo);
        svg += `<path d="${line}L${x(pts[pts.length - 1].km)},${base}L${x(pts[0].km)},${base}Z" fill="${LINE_COLOR}" fill-opacity="${ELEV_FILL_OPACITY}" />`
          + `<path d="${line}" fill="none" stroke="${LINE_COLOR}" stroke-width="2" stroke-linejoin="round" />`;
      });
      // One date line per day, at the start of its first ride.
      const dayStarts = starts.filter((s, i) => !i || rideDay(starts[i - 1].ride) !== rideDay(s.ride));
      dayStarts.forEach((s) => {
        svg += `<line x1="${x(s.km)}" x2="${x(s.km)}" y1="${ELEV_PAD.top - 4}" y2="${y(lo)}" stroke="#bbb" stroke-dasharray="3 3" />`
          + `<text x="${x(s.km) + 4}" y="${ELEV_PAD.top - 8}" fill="#666">${dayMonth(s.ride.points[0].date, s.ride.offsetMs)}</text>`;
      });
      svg += `<line id="elev-cross" y1="${ELEV_PAD.top}" y2="${y(lo)}" stroke="#666" visibility="hidden" />`
        + `<circle id="elev-dot" r="4" fill="#ffffff" stroke="${HOVER_COLOR}" stroke-width="2" visibility="hidden" />`;
      elevSvg.innerHTML = svg;
    }

    // Nearest profile point to the pointer: crosshair and tooltip on the chart, marker on the map.
    function hoverElevation(ev) {
      if (!elev) return;
      const { points, totalKm } = elev;
      const w = elevBox.clientWidth;
      const px = ev.clientX - elevBox.getBoundingClientRect().left;
      const km = (px - ELEV_PAD.left) / (w - ELEV_PAD.left - ELEV_PAD.right) * totalKm;
      let a = 0, b = points.length - 1; // binary search on distance
      while (b - a > 1) { const m = (a + b) >> 1; if (points[m].km < km) a = m; else b = m; }
      const e = Math.abs(points[a].km - km) <= Math.abs(points[b].km - km) ? points[a] : points[b];
      const cx = elev.x(e.km), cy = elev.y(e.p.alt);
      const cross = document.getElementById('elev-cross'), dot = document.getElementById('elev-dot');
      cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('visibility', 'visible');
      dot.setAttribute('cx', cx); dot.setAttribute('cy', cy); dot.setAttribute('visibility', 'visible');
      elevTip.innerHTML = `<b>${Math.round(e.p.alt)} m</b> · ${e.km.toFixed(1)} km · ${dayTime(e.p.date, e.p.offsetMs)}`;
      elevTip.style.display = 'block';
      const tipW = elevTip.offsetWidth; // keep the tooltip inside the chart, beside the crosshair
      elevTip.style.left = `${cx + 10 + tipW > w ? cx - 10 - tipW : cx + 10}px`;
      hoverMarker.setLatLng([e.p.lat, e.p.lng]).addTo(map);
    }

    // Route hover: the nearest recorded point gets a marker and a popup; the city name loads
    // only if the cursor rests on the point briefly, to keep Nominatim requests low.
    const routePopup = L.popup({ autoPan: false, closeButton: false, className: 'route-hover', offset: [0, -END_RADIUS] });
    let routePoints = [], routeHoverPoint = null, placeTimer = null;

    function nearestPoint(latlng) {
      const target = map.latLngToLayerPoint(latlng);
      let best = null, bestD = Infinity;
      routePoints.forEach((p) => {
        const d = map.latLngToLayerPoint(p).distanceTo(target);
        if (d < bestD) { best = p; bestD = d; }
      });
      return best;
    }

    function hoverRoute(ev) {
      const p = nearestPoint(ev.latlng);
      if (!p || p === routeHoverPoint) return;
      routeHoverPoint = p;
      const label = `${p.km.toFixed(1)} km`;
      hoverMarker.setLatLng(p).addTo(map);
      routePopup.setLatLng(p).setContent(popup(p, label)).openOn(map);
      clearTimeout(placeTimer);
      placeTimer = setTimeout(() => placeName(p).then((place) => {
        if (routeHoverPoint === p) routePopup.setContent(popup(p, label, place));
      }), 300);
    }

    function leaveRoute() {
      routeHoverPoint = null;
      clearTimeout(placeTimer);
      hoverMarker.remove();
      map.closePopup(routePopup);
    }

    function leaveElevation() {
      elevTip.style.display = 'none';
      ['elev-cross', 'elev-dot'].forEach((id) => document.getElementById(id)?.setAttribute('visibility', 'hidden'));
      hoverMarker.remove();
    }

    elevBox.addEventListener('pointermove', hoverElevation);
    elevBox.addEventListener('pointerleave', leaveElevation);
    window.addEventListener('resize', drawElevation);

    // Milestones from milestones.json, in travel order: [{name, lat, lng}].
    // A milestone counts as reached once the route passes within MILESTONE_REACH_M of it;
    // reaching one also marks the ones before it as reached.
    const MILESTONE_REACH_M = 1000;
    const BIKE_ROUTE_URL = 'https://routing.openstreetmap.de/routed-bike/route/v1/driving'; // OSRM with a bike profile
    let milestones = []; // each also gets reached, and toGoKm: distance from Etienne's last point, through the milestones before it

    function setMilestones(list, rides) {
      const points = rides.flatMap((r) => r.points);
      let lastReached = -1;
      list.forEach((m, i) => {
        if (points.some((p) => L.latLng(p).distanceTo(m) <= MILESTONE_REACH_M)) lastReached = i;
      });
      milestones = list.map((m, i) => ({ ...m, reached: i <= lastReached, toGoKm: null, straight: false }));
    }

    // Bike road distance from the last point to every milestone ahead, in one request.
    // Falls back to straight lines if the routing server fails.
    async function routeMilestones(rides) {
      const ahead = milestones.filter((m) => !m.reached);
      const here = rides.length && rides[rides.length - 1].points.slice(-1)[0];
      if (!here || !ahead.length) return;
      const stops = [here, ...ahead];
      try {
        const coords = stops.map((p) => `${p.lng.toFixed(5)},${p.lat.toFixed(5)}`).join(';');
        const j = await (await fetch(`${BIKE_ROUTE_URL}/${coords}?overview=false`)).json();
        if (j.code !== 'Ok') throw new Error(j.message || j.code);
        let km = 0;
        j.routes[0].legs.forEach((leg, i) => { km += leg.distance / 1000; ahead[i].toGoKm = km; });
      } catch (e) {
        console.warn('bike route', e);
        let km = 0;
        ahead.forEach((m, i) => { km += L.latLng(stops[i]).distanceTo(m) / 1000; m.toGoKm = km; m.straight = true; });
      }
      drawMilestoneNext();
    }

    // "123 km", "~98 km (straight)" when the road distance is unavailable, "… km" while loading.
    function toGoText(m) {
      if (m.toGoKm == null) return '… km';
      return m.straight ? `~${Math.round(m.toGoKm)} km (${t('straight')})` : `${Math.round(m.toGoKm)} km`;
    }

    // Line under the rides table; always about the whole trip, whatever day is picked.
    function drawMilestoneNext() {
      const box = document.getElementById('milestone-next');
      const next = milestones.find((m) => !m.reached);
      box.hidden = !milestones.length;
      box.innerHTML = next ? `${t('next')}: <b>${next.name}</b> · ${toGoText(next)}` : t('allReached');
    }

    // Flag whose pole stands on p: solid START_COLOR for the start, checkered for the finish.
    // Not interactive, so hover and click reach the dot below. Own pane above the labels, which would hide it near a milestone.
    map.createPane('flags').style.zIndex = 660; // tooltipPane is 650
    function flagMarker(p, checkered) {
      const cloth = checkered
        ? [0, 1, 2].flatMap((c) => [0, 1].map((r) =>
          `<rect x="${3 + 6 * c}" y="${2 + 6 * r}" width="6" height="6" fill="${(c + r) % 2 ? '#fff' : '#222'}"/>`)).join('')
          + '<rect x="3" y="2" width="18" height="12" fill="none" stroke="#222"/>'
        : `<rect x="3" y="2" width="18" height="12" fill="${START_COLOR}"/>`;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${FLAG_SIZE}" height="${FLAG_SIZE}" viewBox="0 0 28 28">`
        + `<line x1="2" y1="1" x2="2" y2="28" stroke="#222" stroke-width="2"/>${cloth}</svg>`;
      return L.marker([p.lat, p.lng], {
        pane: 'flags', interactive: false,
        icon: L.divIcon({ className: '', html: svg, iconSize: [FLAG_SIZE, FLAG_SIZE], iconAnchor: [2, FLAG_SIZE] }),
      });
    }

    function milestoneMarker(m) {
      const next = m === milestones.find((x) => !x.reached);
      const finish = m === milestones[milestones.length - 1];
      const color = m.reached ? MILESTONE_DONE_COLOR : MILESTONE_COLOR;
      const marker = L.circleMarker([m.lat, m.lng], {
        renderer: endsRenderer, radius: END_RADIUS, color, weight: 3, fillColor: next ? color : '#ffffff', fillOpacity: 1,
      }).bindTooltip(m.name, {
        permanent: true, direction: 'top', offset: [0, -(finish ? FLAG_SIZE : END_RADIUS)], className: `ride-label milestone-label${m.reached ? ' milestone-done' : ''}`,
      });
      return marker.bindPopup(() => `<b>${m.name}</b><br>${m.reached ? t('reached') : t('toGo')(toGoText(m))}`, { autoPan: false })
        .on('mouseover', () => marker.openPopup())
        .on('mouseout', () => marker.closePopup());
    }

    // Milestone dots; the one Etienne is heading to pulses and gets a dashed line from his last point.
    // Flags mark the trip's first point and the last milestone, whatever day is picked.
    map.createPane('pulse').style.zIndex = 440; // under the milestone dots in the 'ends' pane
    function drawMilestones() {
      milestones.forEach((m) => milestoneMarker(m).addTo(layer));
      if (milestones.length) flagMarker(milestones[milestones.length - 1], true).addTo(layer);
      if (allRides.length) flagMarker(allRides[0].points[0], false).addTo(layer);
      const next = milestones.find((m) => !m.reached);
      if (!next) return;
      const size = 2 * END_RADIUS + 3; // dot with its outline
      L.marker([next.lat, next.lng], {
        pane: 'pulse', interactive: false,
        icon: L.divIcon({ className: '', html: '<div class="milestone-pulse"></div>', iconSize: [size, size] }),
      }).addTo(layer);
      const here = allRides.length && allRides[allRides.length - 1].points.slice(-1)[0];
      if (here) L.polyline([[here.lat, here.lng], [next.lat, next.lng]], {
        color: MILESTONE_COLOR, weight: 3, dashArray: '6 8', interactive: false,
      }).addTo(layer);
    }

    // Last upload: time of the latest commit that changed a .fit file, from the GitHub API, in the viewer's timezone.
    // Hidden if the API fails (e.g. rate limit: 60 requests per hour per IP).
    const REPO = 'christie26/bike-log';
    let lastUploadDate = null;
    async function showLastUpload() {
      try {
        const [c] = await (await fetch(`https://api.github.com/repos/${REPO}/commits?path=coordinate&per_page=1`)).json();
        lastUploadDate = c.commit.committer.date;
        drawLastUpload();
      } catch (e) { console.warn('last upload', e); }
    }

    function drawLastUpload() {
      if (!lastUploadDate) return;
      const box = document.getElementById('upload');
      box.textContent = `${t('lastUpload')} ${formatDate(lastUploadDate, null,
        { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })}`;
      box.hidden = false;
    }

    // Draw the given rides: route line, start and end markers, elevation chart and rides box.
    // fit: zoom the map to the rides; off when only the language changes.
    let shownRides = [];
    function showRides(rides, fit = true) {
      shownRides = rides;
      leaveRoute();
      map.closePopup();
      layer.clearLayers();
      drawRidesBox();
      drawMilestones();
      const points = rides.flatMap((r) => r.points);
      routePoints = points;
      elev = points.length ? buildProfile(rides) : null;
      if (elev && !elev.points.length) elev = null;
      elevBox.hidden = !elev;
      map.invalidateSize();
      if (elev) drawElevation();
      if (!points.length) return;

      // Separate line per ride, so different days are not joined by a straight line.
      const latlngs = rides.map((r) => r.points.map((p) => [p.lat, p.lng]));
      const line = L.polyline(latlngs, { color: LINE_COLOR, weight: 4, interactive: false }).addTo(layer);
      L.polyline(latlngs, { opacity: 0, weight: ROUTE_HIT_PX }).addTo(layer)
        .on('mousemove', hoverRoute).on('mouseout', leaveRoute);
      if (fit) map.fitBounds(line.getBounds(), { padding: [30, 30] });

      // Labels only at the first start and the last end of each day, with the date colored by start or end;
      // other ride starts and ends get a small dot. A day's end and the next day's start closer than
      // OVERNIGHT_M share one label on the end: "4 Oct → 5 Oct".
      const dateSpan = (p, r, kind) => `<span class="label-${kind}">${dayMonth(p.date, r.offsetMs)}</span>`;
      rides.forEach((r, i) => {
        const first = r.points[0], last = r.points[r.points.length - 1];
        const prev = rides[i - 1], next = rides[i + 1];
        const dayStart = !prev || rideDay(prev) !== rideDay(r);
        const dayEnd = !next || rideDay(next) !== rideDay(r);
        const overnightBefore = dayStart && prev && L.latLng(prev.points[prev.points.length - 1]).distanceTo(first) <= OVERNIGHT_M;
        const overnightAfter = dayEnd && next && L.latLng(last).distanceTo(next.points[0]) <= OVERNIGHT_M;
        const pathEnd = !next;
        [[first, 'start', START_COLOR, dayStart], [last, 'end', END_COLOR, dayEnd]].forEach(([p, text, color, labeled]) => {
          const label = `${dayMonth(p.date, r.offsetMs)} ${t(text)}`;
          let tooltip = dateSpan(p, r, text);
          if (text === 'start' && overnightBefore) tooltip = null; // label is on the previous day's end
          if (text === 'end' && overnightAfter) tooltip += ` → ${dateSpan(next.points[0], next, 'start')}`;
          const tripStart = p === allRides[0].points[0];
          const gap = pathEnd && text === 'end' ? ETIENNE_SIZE / 2 : tripStart ? FLAG_SIZE : END_RADIUS;
          const marker = (labeled ? labelMarker(p, label, color, tooltip, gap) : stopMarker(p, label, color)).addTo(layer);
          // The hover popup's own click handler runs first and closes it; then the summary opens.
          marker.on('click', () => showSummary(r, marker.getLatLng()));
        });
      });

      // Etienne's photo on the last point; not interactive, so hover and click reach the end marker below.
      const end = points[points.length - 1];
      L.marker([end.lat, end.lng], {
        interactive: false,
        icon: L.icon({ iconUrl: 'etienne.webp', iconSize: [ETIENNE_SIZE, ETIENNE_SIZE] }),
      }).addTo(layer);
    }

    // Day picked in the rides box: show only the rides that start on it; '' shows every ride.
    let pickedDay = '';
    const rideDay = (r) => isoDay(r.points[0].date, r.offsetMs);
    // Day of the trip, counted from the first ride's day; rest days count too. "2026-10-04" parses as UTC midnight.
    const tripDay = (r) => Math.round((new Date(rideDay(r)) - new Date(rideDay(allRides[0]))) / 86400000) + 1;
    function pickDay(day) {
      pickedDay = day;
      showRides(day ? allRides.filter((r) => rideDay(r) === day) : allRides);
    }

    // Legend in the top right corner, in the chosen language.
    function drawLegend() {
      const swatch = (color) => `<span class="swatch" style="border-color:${color}"></span>`;
      document.getElementById('legend').innerHTML = [
        `${swatch(START_COLOR)}${t('start')}`,
        `${swatch(END_COLOR)}${t('end')}`,
        `<b><span class="label-end">A</span> → <span class="label-start">B</span></b> ${t('overnight')}`,
        `${swatch(MILESTONE_COLOR)}${t('milestone')}`,
      ].join('<br>');
    }
    drawLegend();

    let allRides = [];
    async function loadAll() {
      const milestoneList = fetch('milestones.json').then((r) => r.json())
        .catch((e) => { console.warn('milestones', e); return []; });
      const files = await (await fetch('files.json')).json();
      const buffers = await Promise.all(files.map(async (f) =>
        (await fetch('coordinate/' + encodeURIComponent(f))).arrayBuffer()));
      // Rides from all files, in time order.
      allRides = buffers.flatMap((b, i) => parseFit(b, files[i]))
        .filter((r) => r.points.length)
        .sort((a, b) => new Date(a.points[0].date) - new Date(b.points[0].date));
      console.log(allRides);
      setMilestones(await milestoneList, allRides);
      drawMilestoneNext();
      showRides(allRides);
      queueCities(allRides.map(cityJob));
      routeMilestones(allRides);
    }

    // Guestbook: messages kept by server.js (/api/messages), no login.
    // The name is kept in a cookie so returning visitors need not retype it.
    // Hidden when the API is missing (e.g. the page served by GitHub Pages).
    const MESSAGES_URL = 'api/messages';
    const MESSAGES_REFRESH_MS = 30 * 1000; // new messages from other visitors appear within this time
    const NAME_COOKIE = 'guestName';
    const NAME_COOKIE_MAX_AGE_S = 365 * 24 * 3600;
    const gbBox = document.getElementById('gb');
    const gbName = document.getElementById('gb-name');
    const gbText = document.getElementById('gb-text');
    let messages = [];

    function readNameCookie() {
      const c = document.cookie.split('; ').find((c) => c.startsWith(NAME_COOKIE + '='));
      return c ? decodeURIComponent(c.slice(NAME_COOKIE.length + 1)) : '';
    }
    function saveNameCookie(name) {
      document.cookie = `${NAME_COOKIE}=${encodeURIComponent(name)}; max-age=${NAME_COOKIE_MAX_AGE_S}; path=/; SameSite=Lax`;
    }

    // Oldest first (the API returns newest first). textContent, never innerHTML: messages come from anyone.
    function drawMessages() {
      const list = document.getElementById('gb-list');
      list.replaceChildren();
      if (!messages.length) { list.textContent = t('noMessage'); return; }
      for (const m of [...messages].reverse()) {
        const div = document.createElement('div');
        div.className = 'gb-msg';
        const meta = document.createElement('div');
        meta.className = 'gb-meta';
        const name = document.createElement('span');
        name.className = 'gb-name';
        name.textContent = m.name;
        meta.append(name, formatDate(m.createdAt, null,
          { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }));
        div.append(meta, m.text);
        list.append(div);
      }
    }

    async function loadMessages() {
      const res = await fetch(MESSAGES_URL);
      if (!res.ok) throw new Error(`${res.status}`);
      messages = await res.json();
      drawMessages();
    }

    async function startGuestbook() {
      try { await loadMessages(); } catch (e) { console.warn('guestbook', e); return; }
      setInterval(() => loadMessages().catch((e) => console.warn('guestbook', e)), MESSAGES_REFRESH_MS);

      gbName.value = readNameCookie();
      const gbOpen = document.getElementById('gb-open');
      gbOpen.classList.add('gb-closed');
      const showGuestbook = (open) => {
        gbBox.hidden = !open;
        gbOpen.classList.toggle('gb-closed', !open);
        if (open) (gbName.value ? gbText : gbName).focus();
      };
      gbOpen.onclick = () => showGuestbook(gbBox.hidden);
      // A press anywhere outside the panel and its button closes the panel. Capture phase: the map cannot swallow it.
      document.addEventListener('pointerdown', (e) => {
        if (!gbBox.hidden && !gbBox.contains(e.target) && !gbOpen.contains(e.target)) showGuestbook(false);
      }, true);
      document.getElementById('gb-form').onsubmit = async (e) => {
        e.preventDefault();
        const name = gbName.value.trim(), text = gbText.value.trim();
        if (!name || !text) return;
        const send = document.getElementById('gb-send');
        send.disabled = true;
        try {
          const res = await fetch(MESSAGES_URL, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, text }),
          });
          if (!res.ok) throw new Error(`${res.status}`);
          saveNameCookie(name);
          gbText.value = '';
          await loadMessages();
        } catch (err) {
          console.warn('guestbook send', err);
          alert(t('sendFailed'));
        } finally { send.disabled = false; }
      };
      // Enter sends, Shift+Enter adds a new line. isComposing: Korean/Japanese IME uses Enter to confirm a character.
      gbText.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' || e.shiftKey || e.isComposing || e.keyCode === 229) return;
        e.preventDefault();
        if (!document.getElementById('gb-send').disabled) document.getElementById('gb-form').requestSubmit();
      });
      document.getElementById('gb-open').hidden = false;
    }

    showLastUpload();
    startGuestbook();
    loadAll();
  </script>
</body>
</html>
